<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="shortcut icon" href="%PUBLIC_URL%/icon.png" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <link rel="stylesheet" href="%PUBLIC_URL%/style.css?v=2001">
  <title>Intermoda</title>
  <style type="text/css">
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
    }

    .TitleScreen {
      background-color: #e0e0e0;
      height: 100vh;
      display: flex;
    }

    .LogoTitle {
      margin: auto;
    }

    @media (max-width:768px) {
      .LogoTitle {
        width: 80%;
      }
    }
  </style>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root">
    <div class="TitleScreen">
      <img class="LogoTitle"
        src="/images/Logo2.png"
        alt="Logo">
    </div>
  </div>
  <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('worker.js').then(function (registration) {
          console.log('Worker registration successful', registration.scope);
        }, function (err) {
          console.log('Worker registration failed', err);
        }).catch(function (err) {
          console.log(err);
        });
      });
    } else {
      console.log('Service Worker is not supported by browser.');
    }

    const disableF5 = e =>{
      if (localStorage.getItem('Conexion') === "offline") {
        if ((e.which || e.keyCode) === 116) {
          alert('Debe disponer de internet para poder actualizar.');
          e.preventDefault();
        }
      } else {
        if (!navigator.onLine) {
          if ((e.which || e.keyCode) === 116) {
            alert('Debe disponer de internet para poder actualizar.');
            e.preventDefault();
          }
        }
      }
    }

    document.addEventListener("keydown",disableF5)
  </script>
</body>

</html>
